# awmaker build via Docker on macOS
#
# Mounts the host awmaker tree (including the `third_party/wmaker-crm`
# submodule) read-write into the container, then builds it. Build artifacts,
# the shared libraries (build-libs/) and the resulting binaries are all written
# back to the host, so you can edit the sources on macOS and rebuild.
#
# Nothing is installed outside the working tree: the shared libraries go to
# <tree>/build-libs and the awmaker binary stays in <tree>/src.

services:
  build:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: awmaker-builder
    # Read/write mount of the host awmaker tree. On mac use the native file
    # sharing (VirtioFS recommended: Settings -> General -> VirtioFS) for
    # acceptable performance.
    volumes:
      - ..:/workspace/awmaker
    working_dir: /workspace/awmaker
    environment:
      # Keep the build quiet but visible
      - MAKEFLAGS=--no-print-directory
      # Takes its value from the shell (passthrough), so `INSTALL=1 docker
      # compose run ... build` stages the binary + system data into the local
      # prefix build-libs/stage. Unset/0 means build-only (no install). See
      # script/docker-build.sh for the default (0) and the local PREFIX.
      - INSTALL
      - PREFIX
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - script/docker-build.sh

  # Run awmaker inside the container, drawing its windows on the macOS X
  # server (XQuartz) over TCP. script/docker-run.sh launches a dedicated
  # XQuartz server (no quartz-wm) and injects the X cookie into a temporary
  # Xauthority that is mounted read-only here.
  run:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: awmaker-builder
    volumes:
      - ..:/workspace/awmaker
    working_dir: /workspace/awmaker
    environment:
      - MAKEFLAGS=--no-print-directory
    entrypoint:
      - /bin/bash
      - -lc
